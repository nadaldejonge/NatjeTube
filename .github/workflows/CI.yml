name: Build NatjeTube APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
      - name: Set up Java 11 for Robolectric
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '11'
          distribution: temurin
      - name: Preserve test JVM
        run: echo "NATJETUBE_TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;30.0.3' 'ndk;21.0.6113669'
      - name: Run regression tests
        run: |
          chmod +x gradlew
          ./gradlew :common:testStstableReleaseUnitTest :smarttubetv:testStstableReleaseUnitTest -I tools/test-java11.gradle --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NatjeTube-test-reports
          path: |
            common/build/test-results/
            smarttubetv/build/test-results/
          if-no-files-found: warn
      - name: Build stable universal APK
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableRelease --no-daemon
      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: NatjeTube-unsigned-universal
          path: smarttubetv/build/outputs/apk/ststable/release/*universal*.apk
          if-no-files-found: error
